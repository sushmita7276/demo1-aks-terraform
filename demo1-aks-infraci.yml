
trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

# Stage 1: Terraform Plan
- stage: Plan
  jobs:
  - job: TerraformPlan
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.13.3'

    - script: |
        terraform init
        terraform validate
        terraform plan -out=tfplan
      displayName: 'Terraform Plan'

    - publish: tfplan
      artifact: terraform-plan


# Stage 2: Terraform Apply
- stage: Apply
  dependsOn: Plan
  jobs:
  - job: TerraformApply
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.13.3'

    - download: current
      artifact: terraform-plan

    - script: |
        terraform init
        terraform apply -auto-approve "$(Pipeline.Workspace)/terraform-plan/tfplan"
      displayName: 'Terraform Apply'
